# docker-compose.yml
# ========================================================================
#  CognitoMM local development / production stack.
#  Usage: docker compose up -d
# ========================================================================
services:
  app:
    build: .
    container_name: cognito_bot
    restart: unless-stopped
    ports:
      - "${PORT:-7860}:${PORT:-7860}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-7860}
    volumes:
      # Mount only the source for live-reload during dev; comment out for prod
      - .:/app
      - /app/__pycache__
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-7860}/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cognito-net

  mongodb:
    image: mongo:7
    container_name: cognito_mongo
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: mongosh --quiet --eval "db.runCommand({ ping: 1 })" || mongosh --quiet --eval "db.adminCommand('ping')"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - cognito-net

volumes:
  mongodb_data:

networks:
  cognito-net:
    driver: bridge